<!DOCTYPE html>
<!-- Compiler: an editor and in-browser runners for C, C++, Python, JavaScript, TypeScript, Lua,
     Ruby and SQL. Everything runs on this computer, without a server and without the network;
     the page works from disk (file://) and from a site. Compilers and interpreters are packed in
     vendor/ and load when their language is first used. Python and the CodeMirror editor core
     are shared with web/python_ide (path in paths.js). -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<script src="coi-sw.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="Компилятор">
<meta name="description" content="Компилятор в браузере: C, C++, Python, JavaScript, TypeScript, Lua, Ruby и SQL без сервера и без сети.">
<title>Компилятор - C, C++, Python, JavaScript и другие языки в браузере</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='3' width='20' height='18' rx='4' fill='%235b8def'/%3E%3Cpath d='M7 9l-3 3 3 3M17 9l3 3-3 3M13.5 7l-3 10' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="compiler.css">
<script src="paths.js"></script>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="sideToggle" data-i18n-aria="files" data-i18n-title="files">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <span class="title">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="4" fill="var(--accent)"/><path d="M7 9l-3 3 3 3M17 9l3 3-3 3M13.5 7l-3 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span data-i18n="appName">Компилятор</span>
  </span>
  <select id="langSel" data-i18n-aria="language" data-i18n-title="language"></select>
  <select id="exampleSel" data-i18n-aria="examples" data-i18n-title="examples"></select>
  <button class="btn primary" id="runBtn" data-i18n-title="runTitle">
    <svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg><span class="label" data-i18n="run">Запустить</span>
  </button>
  <button class="btn danger" id="stopBtn" disabled data-i18n-title="stopTitle">
    <svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1"/></svg><span class="label" data-i18n="stop">Стоп</span>
  </button>
  <span class="spacer"></span>
  <label class="field" data-i18n-title="timeLimit">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <select id="limitSel" data-i18n-aria="timeLimit"></select>
  </label>
  <button class="btn" id="importBtn" data-i18n-title="importTitle">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2h3l1.5 2h4.5A1.5 1.5 0 0 1 14 5.5V12a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label" data-i18n="import">Открыть</span>
  </button>
  <input type="file" id="fileInput" multiple hidden>
  <button class="btn" id="exportBtn" data-i18n-title="exportTitle">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label" data-i18n="export">Скачать</span>
  </button>
  <select id="themeSel" data-i18n-aria="theme" data-i18n-title="theme"></select>
  <button class="btn" id="uiLangBtn" data-i18n-title="uiLang" data-i18n-aria="uiLang">EN</button>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="side-h"><span data-i18n="files">Файлы</span><button class="icon-btn" id="newFile" data-i18n-title="newFile" data-i18n-aria="newFile">+</button></div>
    <div class="files" id="files" role="listbox" data-i18n-aria="files"></div>
    <div class="side-foot"><span data-i18n="storageNote">Файлы сохраняются в этом браузере.</span><br>
      <button class="link" id="restoreExamples" data-i18n="restoreExamples">вернуть примеры</button></div>
  </aside>

  <section class="workspace">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="editor-wrap"><textarea id="editor" aria-label="Code"></textarea></div>
    <div class="panel">
      <div class="terminal">
        <div class="panel-h"><span data-i18n="output">Вывод</span><button id="clearOut" data-i18n="clear">очистить</button></div>
        <div class="term-body" id="out" aria-live="polite" tabindex="0"></div>
      </div>
      <div class="stdin-box">
        <div class="panel-h"><label for="stdin" data-i18n="input">Ввод (stdin)</label></div>
        <textarea id="stdin" spellcheck="false" data-i18n-placeholder="inputPlaceholder"></textarea>
      </div>
    </div>
    <footer class="statusbar">
      <span class="status" id="status" role="status"><span class="dot"></span><span id="statusText"></span></span>
      <span class="spacer"></span>
      <span id="cursorPos"></span>
      <span id="fileLang"></span>
      <span id="version"></span>
    </footer>
  </section>
</div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button class="link" id="toastUndo" data-i18n="undo">Вернуть</button></div>

<script src="js/i18n.js"></script>
<script src="js/langs.js"></script>
<script src="js/packs.js"></script>
<script src="js/wasi.js"></script>
<script src="js/runners.js"></script>
<script src="js/app.js"></script>
</body>
</html>
